name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: execution_assistant
          POSTGRES_USER: execution_assistant
          POSTGRES_PASSWORD: local-development-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U execution_assistant -d execution_assistant"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://execution_assistant:local-development-only@localhost:5432/execution_assistant
      TEST_DATABASE_URL: postgresql://execution_assistant:local-development-only@localhost:5432/execution_assistant_test
      GOOGLE_CLIENT_ID: test-google-client-id
      GOOGLE_CLIENT_SECRET: test-google-client-secret
      GOOGLE_CALLBACK_URL: http://localhost:3000/auth/google/callback
      AUTH_ALLOWED_CALLBACK_URLS: http://localhost:3000/auth/google/callback
      WEB_APP_URL: http://localhost:5173
      WEB_ORIGINS: http://localhost:5173
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use pinned Node.js and npm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use pinned npm
        run: npm install --global npm@11.9.0

      - name: Install dependencies
        run: npm ci

      - name: Validate migration history and replay from empty
        run: npm run db:migration:check

      - name: Run repository verification
        run: npm run verify

      - name: Install deterministic browser
        run: npm run test:e2e:install:ci

      - name: Run deterministic end-to-end scenarios
        run: npm run test:e2e

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Exercise production container topology
        run: npm run container:smoke

  release-artifacts:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - verify
      - container-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      IMAGE_TAG: ${{ github.sha }}
      RELEASE_WEB_API_BASE_URL: ${{ vars.RELEASE_WEB_API_BASE_URL || 'https://api.invalid' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build immutable API image
        run: docker build --target runtime -f apps/api/Dockerfile -t execution-assistant-api:${IMAGE_TAG} .

      - name: Build immutable migration image
        run: docker build --target migration -f apps/api/Dockerfile -t execution-assistant-migrate:${IMAGE_TAG} .

      - name: Build immutable web image
        run: docker build --target runtime -f apps/web/Dockerfile --build-arg "VITE_API_BASE_URL=${RELEASE_WEB_API_BASE_URL}" -t execution-assistant-web:${IMAGE_TAG} .

      - name: Export immutable image archives
        run: |
          mkdir release-images
          docker save --output release-images/api.tar execution-assistant-api:${IMAGE_TAG}
          docker save --output release-images/migrate.tar execution-assistant-migrate:${IMAGE_TAG}
          docker save --output release-images/web.tar execution-assistant-web:${IMAGE_TAG}

      - name: Upload immutable image archives
        uses: actions/upload-artifact@v4
        with:
          name: execution-assistant-images-${{ github.sha }}
          path: release-images/*.tar
          if-no-files-found: error
          retention-days: 14
