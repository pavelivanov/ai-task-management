name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/009-release-completion

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: execution_assistant
          POSTGRES_USER: execution_assistant
          POSTGRES_PASSWORD: local-development-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U execution_assistant -d execution_assistant"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://execution_assistant:local-development-only@localhost:5432/execution_assistant
      TEST_DATABASE_URL: postgresql://execution_assistant:local-development-only@localhost:5432/execution_assistant_test
      GOOGLE_CLIENT_ID: test-google-client-id
      GOOGLE_CLIENT_SECRET: test-google-client-secret
      GOOGLE_CALLBACK_URL: http://localhost:3000/auth/google/callback
      AUTH_ALLOWED_CALLBACK_URLS: http://localhost:3000/auth/google/callback
      WEB_APP_URL: http://localhost:5173
      WEB_ORIGINS: http://localhost:5173
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use pinned Node.js and npm cache
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use pinned npm
        run: npm install --global npm@11.9.0

      - name: Install dependencies
        run: npm ci

      - name: Validate migration history and replay from empty
        run: npm run db:migration:check

      - name: Run repository verification
        run: npm run verify

      - name: Install deterministic browser
        run: npm run test:e2e:install:ci

      - name: Run deterministic end-to-end scenarios
        run: npm run test:e2e

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Exercise production container topology
        run: npm run container:smoke

  release-artifacts:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/codex/009-release-completion')
    needs:
      - verify
      - container-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ github.sha }}
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ${{ github.repository_owner }}
      RELEASE_WEB_API_BASE_URL: >-
        ${{ github.ref == 'refs/heads/codex/009-release-completion' &&
        'https://api.assistant-staging.pavelivanov.info' ||
        vars.RELEASE_WEB_API_BASE_URL || 'https://api.invalid' }}
    steps:
      - name: Check out release candidate
        uses: actions/checkout@v4

      - name: Check out prior main application
        uses: actions/checkout@v4
        with:
          ref: main
          path: baseline

      - name: Record prior application commit
        run: echo "BASELINE_SHA=$(git -C baseline rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish prior API image
        id: baseline-api
        uses: docker/build-push-action@v6
        with:
          context: baseline
          file: baseline/apps/api/Dockerfile
          target: runtime
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/execution-assistant-api:${{ env.BASELINE_SHA }}

      - name: Build and publish prior web image
        id: baseline-web
        uses: docker/build-push-action@v6
        with:
          context: baseline
          file: baseline/apps/web/Dockerfile
          target: runtime
          push: true
          build-args: VITE_API_BASE_URL=${{ env.RELEASE_WEB_API_BASE_URL }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/execution-assistant-web:${{ env.BASELINE_SHA }}

      - name: Build and publish immutable API image
        id: release-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          push: true
          build-args: IMAGE_REVISION=${{ env.IMAGE_TAG }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/execution-assistant-api:${{ env.IMAGE_TAG }}

      - name: Build and publish immutable migration image
        id: release-migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: migration
          push: true
          build-args: IMAGE_REVISION=${{ env.IMAGE_TAG }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/execution-assistant-migrate:${{ env.IMAGE_TAG }}

      - name: Build and publish immutable web image
        id: release-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: runtime
          push: true
          build-args: |
            IMAGE_REVISION=${{ env.IMAGE_TAG }}
            VITE_API_BASE_URL=${{ env.RELEASE_WEB_API_BASE_URL }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/execution-assistant-web:${{ env.IMAGE_TAG }}

      - name: Record immutable release and rollback digests
        run: |
          mkdir release-images
          {
            echo "release_commit=${IMAGE_TAG}"
            echo "compiled_api_origin=${RELEASE_WEB_API_BASE_URL}"
            echo "api_digest=${{ steps.release-api.outputs.digest }}"
            echo "migration_digest=${{ steps.release-migrate.outputs.digest }}"
            echo "web_digest=${{ steps.release-web.outputs.digest }}"
            echo "rollback_commit=${BASELINE_SHA}"
            echo "rollback_api_digest=${{ steps.baseline-api.outputs.digest }}"
            echo "rollback_web_digest=${{ steps.baseline-web.outputs.digest }}"
          } > release-images/digests.txt

      - name: Upload immutable digest record
        uses: actions/upload-artifact@v4
        with:
          name: execution-assistant-images-${{ github.sha }}
          path: release-images/digests.txt
          if-no-files-found: error
          retention-days: 14
